<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101412" />
    <title>Hand Tracking</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
        background: #101412;
        color: #eef3ed;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 32px;
        background:
          radial-gradient(ellipse at 14% 0%, rgba(105, 157, 106, 0.13), transparent 38%),
          #101412;
      }

      main { width: min(1120px, 100%); margin: 0 auto; }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 20px;
      }

      .eyebrow {
        margin: 0 0 7px;
        color: #8fb894;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 { margin: 0; font-size: 28px; font-weight: 600; }

      .controls { display: flex; align-items: center; gap: 14px; }

      #status {
        color: #aab5ac;
        font-size: 13px;
      }

      button {
        min-width: 116px;
        padding: 10px 16px;
        border: 1px solid #9cc69e;
        border-radius: 4px;
        background: #9cc69e;
        color: #101a12;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled { opacity: 0.5; cursor: wait; }

      .stage {
        position: relative;
        overflow: hidden;
        min-height: 260px;
        aspect-ratio: 16 / 9;
        border: 1px solid #344239;
        border-radius: 6px;
        background-color: #171e19;
        background-image: linear-gradient(#253229 1px, transparent 1px), linear-gradient(90deg, #253229 1px, transparent 1px);
        background-size: 36px 36px;
      }

      video, canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1);
      }

      #three-overlay { z-index: 1; pointer-events: none; }
      #overlay { z-index: 2; pointer-events: none; }

      video { display: none; }

      .empty-state {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #8b998d;
        font-size: 14px;
        pointer-events: none;
      }

      @media (max-width: 620px) {
        body { padding: 20px 14px; }
        header { align-items: start; flex-direction: column; }
        .controls { width: 100%; justify-content: space-between; }
        .stage { min-height: 220px; aspect-ratio: 4 / 3; }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">MediaPipe · Vision</p>
          <h1>Hand tracking</h1>
        </div>
        <div class="controls">
          <span id="status" role="status">Loading hand model…</span>
          <button id="toggle-camera" type="button" disabled>Start camera</button>
        </div>
      </header>
      <section class="stage" aria-label="Hand skeleton and wireframe model">
        <video id="camera" autoplay playsinline muted></video>
        <canvas id="three-overlay" aria-hidden="true"></canvas>
        <canvas id="overlay"></canvas>
        <div id="empty-state" class="empty-state">Hand skeleton will appear here</div>
      </section>
    </main>
    <script>
      if (location.protocol === "file:") {
        document.querySelector("#status").textContent = "Serve this page from localhost";
        document.querySelector("#empty-state").textContent = "Run: python3 -m http.server 8000";
      } else {
        import("./app.js").catch((error) => {
          document.querySelector("#status").textContent = "Could not load the app";
          console.error(error);
        });
      }
    </script>
  </body>
</html>
